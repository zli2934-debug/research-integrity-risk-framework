<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的大伯：红票子｜完整内测加载器</title><body style="margin:0;background:#111;color:#ddd"><script src="payload-01.js"></script><script src="payload-02.js"></script><script src="payload-03.js"></script><script src="payload-04.js"></script><script src="payload-05.js"></script><script src="payload-06.js"></script><script src="payload-07.js"></script><script src="payload-08.js"></script><script src="payload-09.js"></script><script>(async()=>{try{const s=(window.__P||[]).join('');const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="color:white;background:#111;padding:20px">加载失败：'+String(e)+'</pre>'}})()</script></body></html>
